services:
  - type: web
    name: whatsapp-bot
    runtime: node
    buildCommand: npm install && node -e "const puppeteer = require('puppeteer'); puppeteer.executablePath() && console.log('ok')" || npx puppeteer browsers install chrome
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
