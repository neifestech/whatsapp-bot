services:
  - type: web
    name: whatsapp-bot
    runtime: node
    buildCommand: npm install && apt-get update && apt-get install -y google-chrome-stable
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: "/usr/bin/google-chrome-stable"
